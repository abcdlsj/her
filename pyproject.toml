[project]
name = "her"
version = "0.2.0"
description = "A proactive, personified agent that explores information autonomously"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "httpx>=0.27.0",
    "feedparser>=6.0.0",
    "textual>=0.47.0",
]

[project.scripts]
her = "her.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
